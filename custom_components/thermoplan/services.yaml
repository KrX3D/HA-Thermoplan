set_profile:
  fields:
    profile:
      required: true
      example: "Home"
      selector:
        text:

hold:
  fields:
    rooms:
      example: "Living room"
      selector:
        text:
          multiple: true
    temperature:
      example: 22
      selector:
        number:
          min: 4
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    offset:
      example: 2
      selector:
        number:
          min: -10
          max: 10
          step: 0.5
          unit_of_measurement: "°C"
    minutes:
      default: 60
      selector:
        number:
          min: 1
          max: 20160
          unit_of_measurement: "min"

boost:
  fields:
    rooms:
      example: "Living room"
      selector:
        text:
          multiple: true
    offset:
      example: 2
      selector:
        number:
          min: -10
          max: 10
          step: 0.5
          unit_of_measurement: "°C"
    minutes:
      selector:
        number:
          min: 1
          max: 20160
          unit_of_measurement: "min"

cancel_hold:
  fields:
    rooms:
      example: "Living room"
      selector:
        text:
          multiple: true

set_away:
  fields:
    days:
      selector:
        number:
          min: 0
          max: 365
          unit_of_measurement: "days"
    until:
      selector:
        date:
