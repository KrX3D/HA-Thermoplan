<!doctype html>
<!-- Shows the harness in a 390 px wide frame (headless Chrome cannot open windows narrower than 500 px). -->
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<iframe id="f" style="width:390px;height:1500px;border:0;background:#111"></iframe>
<script>
const q = new URLSearchParams(location.hash.slice(1));
document.getElementById("f").style.height = (q.get("h") || 1500) + "px";
document.getElementById("f").src = "harness.html" + location.hash;
</script>
</body></html>
