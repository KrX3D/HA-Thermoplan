schedy_heating:
  module: hass_apps_loader
  class: SchedyApp
  actor_type: thermostat
  expression_environment: |
    def heating_mode():
        return state("input_select.heizungsmodus")
  schedule_append:
    - v: "OFF"
  rooms:
    badezimmer:
      actors:
        climate.better_thermostat_bz:
      schedule:
        - x: "IncludeSchedule(schedule_snippets['grundwaerme_preset1']) if heating_mode() == 'Heizen (Frei / HomeOffice)' else Next()"
        - x: "IncludeSchedule(schedule_snippets['alles_aus_preset2']) if heating_mode() == 'Aus' else Next()"
        - x: "IncludeSchedule(schedule_snippets['grundwaerme_preset3']) if heating_mode() == 'Heizen (Arbeiten)' else Next()"
      rescheduling_delay: 60
    schlafzimmer:
      actors:
        climate.better_thermostat_sz:
      watched_entities:
        - binary_sensor.schlafzimmer_fensterkontakt_contact
      schedule:
        - x: "IncludeSchedule(schedule_snippets['schlafzimmer_preset1']) if heating_mode() == 'Heizen (Frei / HomeOffice)' else Next()"
        - x: "Mark(4.5, Mark.OVERLAY) if something() else Next()"
      rescheduling_delay: 0
  schedule_snippets:
    grundwaerme_preset1:
      - v: 19
        rules:
          - weekdays: 1-7
            rules:
              - { start: "07:00", end: "07:59:59" }
      - v: 20
        rules:
          - weekdays: 1-7
            rules:
              - { start: "08:00", end: "11:59:59" }
      - v: 18
        rules:
          - weekdays: 1-7
            rules:
              - { start: "19:00", end: "06:59:59+1d" }
    alles_aus_preset2:
      - v: "OFF"
    grundwaerme_preset3:
      - v: 18
        rules:
          - weekdays: 1-3, 7
            rules:
              - { start: "19:00", end: "14:59:59+1d" }
          - weekdays: 4
            rules:
              - { start: "19:00", end: "12:29:59+1d" }
    schlafzimmer_preset1:
      - v: 26
        rules:
          - weekdays: 1-5
            rules:
              - { start: "00:00", end: "06:59:59" }
          - weekdays: 6-7
            rules:
              - { start: "00:00", end: "07:59:59" }
      - v: 28
        rules:
          - weekdays: 1-4,7
            rules:
              - { start: "20:00", end: "21:59:59" }
